spring:
  application:
    name: zeiterfassung
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zeiterfassung}
    username: ${DB_USER:zeiterfassung}
    password: ${DB_PASSWORD:zeiterfassung}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  # Nur für Demo und Entwicklung. In Produktion nicht aktivieren.
  seed-demo-data: ${SEED_DEMO_DATA:false}
  # Jahresurlaub in Arbeitstagen (Voreinstellung für alle Mitarbeiter)
  vacation-days-per-year: ${VACATION_DAYS_PER_YEAR:30}
